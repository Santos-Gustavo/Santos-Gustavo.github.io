<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redefinir password</title>
</head>
<body>
  <h1>Redefinir password</h1>

  <input id="newPassword" type="password" placeholder="Nova password" />
  <button onclick="updatePassword()">Guardar nova password</button>

  <p id="message"></p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://haiwrmwpltzhdnrqzxep.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_zAz-dP8YMWOnUqVNqbFt2Q_u734JSv0";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    async function updatePassword() {
      const password = document.getElementById("newPassword").value;
      const message = document.getElementById("message");

      if (!password || password.length < 6) {
        message.textContent = "A password deve ter pelo menos 6 caracteres.";
        return;
      }

      const { error } = await supabaseClient.auth.updateUser({
        password
      });

      if (error) {
        console.error(error);
        message.textContent = "Erro: " + error.message;
        return;
      }

      message.textContent = "Password alterada com sucesso. Pode voltar a entrar.";

      setTimeout(() => {
        window.location.href = "https://santos-gustavo.github.io/app.html";
      }, 1500);
    }
  </script>
</body>
</html>
